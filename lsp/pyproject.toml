[project]
name = "lsp-exp"
version = "0.1.0"
description = "Automated mechanism design for facility location on continuous cycles"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.0.2",
    "matplotlib>=3.10.1",
    "networkx>=3.4.2",
    "psutil>=7.2.2",
    "pulp>=3.0.2",
    "pytest>=8.3.5",
    "rich>=13.9.4",
    "sympy>=1.13.3",
    "typer>=0.15.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.11.1",
]

[tool.ruff]
extend-exclude = ["previous"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "E731"]
